<section>
  <h1>Notes</h1>

  <form [formGroup]="noteForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="title">Title</label>
      <input id="title" formControlName="title" placeholder="Title" />
    </div>
    <div>
      <label for="content">Content</label>
      <textarea id="content" formControlName="content" placeholder="Content"></textarea>
    </div>
    <button type="submit" [disabled]="noteForm.invalid">
      {{ editingNote ? 'Update Note' : 'Create Note' }}
    </button>
    <button type="button" *ngIf="editingNote" (click)="resetForm()">Cancel</button>
  </form>
</section>

<section>
  <h2>All Notes</h2>
  <ul>
    <li *ngFor="let note of notes">
      <strong>{{ note.title }}</strong>
      <p>{{ note.content }}</p>
      <small>Last modified: {{ note.lastModified | date:'medium' }}</small>
      <div>
        <button (click)="onEdit(note)">Edit</button>
        <button (click)="onDelete(note.id)">Delete</button>
      </div>
    </li>
  </ul>
  <p *ngIf="notes.length === 0">No notes yet.</p>
</section>
